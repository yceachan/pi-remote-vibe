name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/browser-ssh/go.mod
          cache-dependency-path: packages/browser-ssh/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:ssh
      - run: pnpm build:ssh
      - run: pnpm build
